name: Feature suggestion
description: An idea that would make the Files pane more useful
title: "Idea: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you'd like the pane to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways around it you've tried or considered.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "0.4.3"
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      placeholder: "2.1.291"
