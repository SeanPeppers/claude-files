name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Claude Code
        # Pinned; a global CLI has no lockfile to install from.
        run: npm install -g @anthropic-ai/claude-code@2.1.291 # zizmor: ignore[adhoc-packages]
      - name: Validate
        run: claude plugin validate --strict .
      - name: Test
        run: claude plugin test .

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Biome (lint + format)
        run: npx --yes @biomejs/biome@2.5.15 ci .
      - name: Engine calls written plainly in tests too
        # validate --strict checks hooks/ but skips tests/, where a cast,
        # '!', '?.' or spread inside a $.noun.method(...) call breaks the
        # plugin-directory rules all the same.
        run: |
          if grep -rnE '\$\.[a-zA-Z]+\.[a-zA-Z]+\([^;]*( as |!\)|\?\.|\.\.\.)' hooks tests; then
            exit 1
          fi

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Claude Code
        # Pinned; a global CLI has no lockfile to install from.
        run: npm install -g @anthropic-ai/claude-code@2.1.291 # zizmor: ignore[adhoc-packages]
      - name: Generate the plugin API types
        # Loading the plugin writes .claude-plugin/types and tsconfig.json,
        # even though the run itself stops for lack of a login.
        run: |
          claude --plugin-dir . -p "x" --max-turns 1 || true
          test -f .claude-plugin/types/claude-code/index.d.ts
      - name: tsc
        run: npx --yes -p typescript@5.9.3 tsc -p .
